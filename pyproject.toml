[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "options-backtester"
version = "0.1.0"
description = "Research slice: Black-Scholes Greeks and costed option strategy backtests with walk-forward OOS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun" }]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "yfinance",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
